@if (visible) {
  <div id="loading-overlay" class="pointer-events-auto fixed inset-0 z-(--z-loading-overlay) flex items-center justify-center bg-transparent" [attr.role]="ariaRoles.status" aria-busy="true" aria-live="polite">
    <span class="size-10 animate-spin rounded-full border-3 border-line border-t-accent motion-reduce:animate-none" aria-hidden="true"></span>
  </div>
}
