<label class="flex items-center gap-2 whitespace-nowrap" [attr.for]="controlId">
  <span class="text-meta text-text-muted">Per page</span>
  <select class="px-3 py-2 text-meta" [attr.id]="controlId" (change)="choose($event)">
    @for (choice of choices; track choice) {
      <option [value]="choice" [selected]="choice === value">{{ choice }}</option>
    }
  </select>
</label>
