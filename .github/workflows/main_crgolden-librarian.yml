
name: Build and deploy Node.js app to Azure Web App - crgolden-librarian

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type-check E2E specs
        run: npm run typecheck:e2e

      - name: Type-check unit specs
        run: npm run typecheck:spec

      - name: Lint stylesheets
        run: npm run lint:css

      - name: Check design primitives
        run: npm run lint:primitives

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Fix LCOV paths for SonarQube
        run: sed -i 's|\\|/|g' coverage/lcov.info

      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        id: cache-playwright
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npm run playwright:install

      - name: Save Playwright browsers cache
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Run E2E tests
        run: npm run e2e

      - name: Check template classes against the built CSS
        run: npm run lint:utilities

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright failure artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: librarian-playwright-artifacts
          path: playwright-artifacts/
          if-no-files-found: ignore

      - name: SonarCloud analysis
        if: github.actor != 'dependabot[bot]'
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/*.d.ts,e2e/**,instrumentation.mjs
            -Dsonar.coverage.exclusions=e2e/**,scripts/**,**/*.config.*,src/test-setup.ts,src/proxy.conf.js,src/environments/**,src/main.ts,src/main.server.ts,src/server.ts,src/app/app.routes.server.ts
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.scanner.skipJreProvisioning=true

      - name: Build (production)
        run: npm run build

      - name: Prune devDependencies
        if: github.ref == 'refs/heads/main'
        run: npm prune --omit=dev

      - name: Assemble deployment package
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p publish
          cp -r dist publish/dist
          cp -r node_modules publish/node_modules
          cp instrumentation.mjs publish/instrumentation.mjs
          cp package.json publish/package.json
          cp package-lock.json publish/package-lock.json

      - name: Upload artifact for deployment job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: publish/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    outputs:
      webapp-url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: node-app
          path: publish/

      - name: Login to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D756F79CA8D94D1EA4518261D568118D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D443AE464D9A492BADD5AC11552C027E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FF9FA6D4351C49F8BF1F71AD80D58633 }}

      - name: Verify App Service Node runtime matches the build
        run: |
          expected="NODE|$(tr -d '[:space:]' < .nvmrc)-lts"
          actual=$(az webapp config show --name 'crgolden-librarian' --resource-group 'crgolden' \
            --query linuxFxVersion --output tsv)
          if [ "$actual" != "$expected" ]; then
            echo "::error::App Service runtime is '$actual' but this build targets '$expected'. Update the App Service stack or .nvmrc before deploying."
            exit 1
          fi
          echo "App Service runtime '$actual' matches the build."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: 'crgolden-librarian'
          slot-name: 'Production'
          package: publish/
          startup-command: 'node --import ./instrumentation.mjs dist/librarian.client/server/server.mjs'

  smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore npm cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Restore Playwright browsers cache
        id: cache-playwright
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ needs.build.outputs.playwright-version }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npm run playwright:install

      - name: Warm up deployed app
        run: |
          url="${{ needs.deploy.outputs.webapp-url }}/health"
          for i in $(seq 1 12); do
            if curl -sf "$url" | grep -q 'Healthy'; then
              echo "App is healthy after $i attempt(s)."
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "Warning: app did not report Healthy after 12 attempts — proceeding anyway."
            else
              echo "Attempt $i: not ready yet, waiting 10s..."
              sleep 10
            fi
          done

      - name: Run smoke tests
        env:
          SmokeBaseUrl: ${{ needs.deploy.outputs.webapp-url }}
        run: npm run e2e:smoke

      - name: Upload smoke Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload smoke Playwright failure artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: librarian-smoke-playwright-artifacts
          path: playwright-artifacts/
          if-no-files-found: ignore
